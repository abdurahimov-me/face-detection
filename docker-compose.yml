services:
  app:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    container_name: hr_chat_app
    entrypoint: /scripts/entrypoint.sh
    networks:
      - local
    ports:
      - "127.0.0.1:8065:8000"
    env_file:
      - .env
    environment:
      - REDIS_HOST=hr_chat_redis
      - REDIS_PORT=6379


  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: hr_chat_admin
    entrypoint: ./admin/entrypoint.sh
    networks:
      - local
    ports:
      - "127.0.0.1:8066:8001"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - REDIS_PORT=6379
      - REDIS_HOST=hr_chat_redis

volumes:
  redis_data: { }


networks:
  local:
    name: hr_shared_net
    external: true
